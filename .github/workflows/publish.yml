name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
      - name: Verify release tag matches revision
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=revision -q -DforceStdout)"
          test "v${VERSION}" = "${{ github.event.release.tag_name }}"
      - name: Test and publish
        run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
